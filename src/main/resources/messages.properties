bot.about.text=\uD83E\uDD16 \u042F \u0411\u043E\u0442 \u0434\u043B\u044F \u0433\u043E\u043B\u043E\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u0442\u0430 \u043F\u0440\u043E\u0433\u043D\u043E\u0437\u0456\u0432 \u043D\u0430 \u043C\u0430\u0442\u0447\u0456 Dota 2.\n\u041D\u0430 \u043F\u043E\u0447\u0430\u0442\u043A\u0443 \u043A\u043E\u0436\u043D\u043E\u0433\u043E \u043C\u0430\u0442\u0447\u0443 \u0437\u0430\u043F\u0443\u0441\u043A\u0430\u044E \u043E\u043F\u0438\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u2014 \u0445\u0442\u043E \u043F\u0435\u0440\u0435\u043C\u043E\u0436\u0435: <b>Radiant</b> \u0447\u0438 <b>Dire</b>.\n\u041F\u0456\u0441\u043B\u044F \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u043D\u044F \u043C\u0430\u0442\u0447\u0443 \u043F\u0456\u0434\u0431\u0438\u0432\u0430\u044E \u043F\u0456\u0434\u0441\u0443\u043C\u043A\u0438 \u0442\u0430 \u0432\u0435\u0434\u0443 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0443 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0443 \u043A\u043E\u0436\u043D\u043E\u0433\u043E \u0433\u0440\u0430\u0432\u0446\u044F.\n\n\uD83D\uDCCB <b>\u0424\u0443\u043D\u043A\u0446\u0456\u043E\u043D\u0430\u043B:</b>\n \u251C \uD83D\uDDF3<b>\u0413\u043E\u043B\u043E\u0441\u0443\u0432\u0430\u043D\u043D\u044F:</b>\n \u2502  \u251C \u041D\u0430 \u043F\u043E\u0447\u0430\u0442\u043A\u0443 \u043C\u0430\u0442\u0447\u0443 \u0437'\u044F\u0432\u043B\u044F\u0454\u0442\u044C\u0441\u044F \u043E\u043F\u0438\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0437\u0456 \u0441\u043A\u043B\u0430\u0434\u043E\u043C \u043A\u043E\u043C\u0430\u043D\u0434\n \u2502  \u251C \u041A\u043D\u043E\u043F\u043A\u0438 \u0434\u043B\u044F \u0433\u043E\u043B\u043E\u0441\u0443\u0432\u0430\u043D\u043D\u044F: \uD83C\uDF4F <b>Radiant</b> / \uD83C\uDF4E <b>Dire</b>\n \u2502  \u251C \u0427\u0435\u0440\u0435\u0437 \u0445\u0432\u0438\u043B\u0438\u043D\u0443 \u0433\u043E\u043B\u043E\u0441\u0443\u0432\u0430\u043D\u043D\u044F \u0437\u0430\u043A\u0440\u0438\u0432\u0430\u0454\u0442\u044C\u0441\u044F \u0456 \u043F\u043E\u043A\u0430\u0437\u0443\u044E\u0442\u044C\u0441\u044F \u0432\u0456\u0434\u0441\u043E\u0442\u043A\u0438\n \u2502  \u2514 \u041F\u0456\u0441\u043B\u044F \u043C\u0430\u0442\u0447\u0443 \u0431\u043E\u0442 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u043B\u044F\u0454 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u0438 \u043F\u0440\u043E\u0433\u043D\u043E\u0437\u0456\u0432\n \u2514 \uD83D\uDCBB <b>\u041A\u043E\u043C\u0430\u043D\u0434\u0438:</b>\n      \u251C /statistic \u2014 \u0432\u0430\u0448\u0430 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0430 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0430\n      \u251C /statistic @username \u2014 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0430 \u0456\u043D\u0448\u043E\u0433\u043E \u0433\u0440\u0430\u0432\u0446\u044F\n      \u251C /statistic_all \u2014 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0430 \u0447\u0430\u0442\u0443\n      \u2514 /about \u2014 \u0456\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0456\u044F \u043F\u0440\u043E \u0431\u043E\u0442\u0430

