bot.about.text=🤖 Я Бот для голосування та прогнозів на матчі Dota 2.\nНа початку кожного матчу запускаю опитування — хто переможе: <b>Radiant</b> чи <b>Dire</b>.\nПісля завершення матчу підбиваю підсумки та веду особисту статистику кожного гравця.\n\n📋 <b>Функціонал:</b>\n ├ 🗳<b>Голосування:</b>\n │  ├ На початку матчу з'являється опитування зі складом команд\n │  ├ Кнопки для голосування: 🍏 <b>Radiant</b> / 🍎 <b>Dire</b>\n │  ├ Через хвилину голосування закривається і показуються відсотки\n │  └ Після матчу бот повідомляє результати прогнозів\n └ 💻 <b>Команди:</b>\n      ├ /statistic — ваша особиста статистика\n      ├ /statistic @username — статистика іншого гравця\n      ├ /statistic_all — статистика чату\n      └ /about — інформація про бота

