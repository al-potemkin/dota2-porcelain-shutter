# Application
spring.application.name=porcelain-shutter-service
server.port=${SERVER_PORT:8080}

# Feign
feign.clients.d2collage-service.name=d2collage-service
feign.clients.d2collage-service.url=${D2C_SERVICE_URL:}
feign.clients.d2collage-service.enable=${D2C_SERVICE_ENABLE:false}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Telegram Bot
telegram.bot.username=${BOT_USERNAME}
telegram.bot.token=${BOT_TOKEN}

telegram.bot.debug.enabled=${BOT_DEBUG_ENABLED}
telegram.bot.debug.chat-id=${BOT_DEBUG_CHAT_ID:}

# Voting duration (minutes)
telegram.bot.vote-duration-minutes=1

# Logging
logging.level.com.example=INFO

# Localization
telegram.bot.localization.tag=${BOT_LOCALIZATION_TAG:uk-UA}
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false